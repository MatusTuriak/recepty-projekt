<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Recepty{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'recipes/style.css' %}">
</head>
<body>

<nav>
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'recipes' %}">Recepty</a>

    {% if user.is_authenticated %}
        <a href="{% url 'add_recipe' %}">Pridať recept</a>
        <a href="{% url 'category_list' %}">Kategórie</a>
        <a href="{% url 'ingredient_list' %}">Ingrediencie</a>

        <span>Prihlásený: {{ user.username }}</span>

        <form method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit">Odhlásiť sa</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Prihlásenie</a>
        <a href="{% url 'register' %}">Registrácia</a>
    {% endif %}
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

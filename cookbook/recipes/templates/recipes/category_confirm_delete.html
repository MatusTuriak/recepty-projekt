{% extends 'recipes/base.html' %}

{% block title %}Zmazať kategóriu{% endblock %}

{% block content %}

<div class="delete-box">
    <h1>Zmazať kategóriu</h1>

    <p>Naozaj chceš zmazať kategóriu <strong>{{ category.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Áno, zmazať</button>
        <a href="{% url 'category_list' %}">Zrušiť</a>
    </form>
</div>

{% endblock %}

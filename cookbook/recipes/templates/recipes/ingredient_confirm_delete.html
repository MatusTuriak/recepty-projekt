{% extends 'recipes/base.html' %}

{% block title %}Zmazať ingredienciu{% endblock %}

{% block content %}

<div class="delete-box">
    <h1>Zmazať ingredienciu</h1>

    <p>Naozaj chceš zmazať ingredienciu <strong>{{ ingredient.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Áno, zmazať</button>
        <a href="{% url 'ingredient_list' %}">Zrušiť</a>
    </form>
</div>

{% endblock %}

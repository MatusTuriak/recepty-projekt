{% extends 'recipes/base.html' %}

{% block title %}Zmazať recept{% endblock %}

{% block content %}

<div class="delete-box">
    <h1>Zmazať recept</h1>

    <p>Naozaj chceš zmazať recept <strong>{{ recipe.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Áno, zmazať</button>
        <a href="{% url 'recipes' %}">Zrušiť</a>
    </form>
</div>

{% endblock %}
